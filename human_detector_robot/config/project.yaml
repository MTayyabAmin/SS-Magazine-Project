# ARK-5 Human Detector Robot — Main Configuration
# ESP32-CAM stream + robot ESP32 dono router se connected hain.

# Multi-Robot Configuration (2 Identical Robots)
# Usage: python main_controller.py --robot 1 (or --robot 2)
active_robot: 1

robots:
  1:
    name: "Robot_Alpha"
    udp_host: "192.168.137.11"
    udp_port: 4210
    telemetry_port: 4211
    stream_url: "http://192.168.137.10:81/stream"
    map_file: "maps/robot1_map.txt"
    trajectory_log: "maps/robot1_movement_log.txt"
  2:
    name: "Robot_Beta"
    udp_host: "192.168.137.21"
    udp_port: 4220
    telemetry_port: 4221
    stream_url: "http://192.168.137.20:81/stream"
    map_file: "maps/robot2_map.txt"
    trajectory_log: "maps/robot2_movement_log.txt"

camera:
  # Fallback default stream URL (Robot 1)
  stream_url: "http://192.168.137.10:81/stream"
  width: 640
  height: 480

robot:
  # Fallback default robot settings
  udp_host: "192.168.137.11"
  udp_port: 4210
  telemetry_port: 4211
  command_rate_hz: 20
  wall_stop_cm: 100
  telemetry_timeout_s: 1.5

yolo:
  # YOLO11 — Ultralytics flagship model (Sep 2024), YOLOv8 se better accuracy + fewer params
  # CPU real-time ke liye: yolo11n.pt (2.6M params, 39.5 mAP)  ← DEFAULT
  # GPU / high accuracy ke liye: yolo11x.pt (56.9M params, 54.7 mAP)
  # Custom trained model ke liye:
  #   weights: best.pt
  #   custom_model: true
  weights: yolo11n.pt
  custom_model: false
  conf: 0.4
  iou: 0.45
  imgsz: 640
  # FIX: har frame par YOLO chalane se FPS gir jata hai (CPU par slow).
  # Har N-wan frame par hi naya detection chalao, beech ke frames mein
  # purana result dikhao. 1 = har frame (purana behavior), 2-3 = zyada
  # tez lekin thora "delayed" detection.
  infer_every_n_frames: 2
  # FIX: pehle ye thresholds main_controller.py mein hardcoded (0.4/0.5/0.55)
  # the aur yahan ke `conf` se match nahi karte the. Ab sab yahin se aate hain.
  fallen_conf: 0.4
  standing_conf: 0.5
  person_conf: 0.55

posture:
  # Bbox height/width ratio thresholds (custom model na ho to fallback)
  standing_ratio_min: 1.2
  fallen_ratio_max: 0.85

wifi_sensing:
  rssi_drop_threshold_dbm: 8.0

control:
  # SPEED FLOOR: every non-zero linear speed must be >= 0.8 m/s.
  # (v_cruise was 0.22, v_creep 0.06 — both raised; the old creep was a
  # deadzone-clearing crawl, which the floor policy replaced.)
  # Firmware agrees: drive() uses MAX_LINEAR_V_MS 1.0f, so 0.8 -> PWM 160.
  # Turns are FULL-SPEED pivots: PIVOT_TURN_V_MS 1.0f in esp32 config.h = MAX_PWM
  # on the moving side, yaw ≈ 5 rad/s. omega only selects LEFT vs RIGHT.
  v_cruise: 0.8               # CRUISE / recovery-restart speed
  v_creep: 0.8                # CREEP_TO_SCAN forward AND the reverse speed
  omega_scan: 0.35            # L-turn direction only (firmware pivot sets rate)
  # Obstacle handling: recognised at 100cm (wall_stop_cm + firmware US_STOP_CM),
  # then creep stops at the 60-90cm band below and the turn starts THERE —
  # the turn begins 50cm farther out than the old 30-40cm band.
  scan_standoff_min_cm: 60    # nearest wall distance accepted for scanning
  scan_standoff_max_cm: 90    # creep forward while the wall is beyond this
  open_path_cm: 120           # sonar reading = open route found
  scan_step_deg: 15           # sample sonar every N degrees while robot rotates
  scan_side_deg: 90           # scan 90° LEFT + 90° RIGHT (T-junction both sides)
  alert_pause_s: 2.0          # pause after human detect, then continue
  # One sighting = ONE pause: ALERT_PAUSE re-arms only after the alert has
  # been continuously clear for this many seconds (stops the pause→creep
  # ping-pong that made the wheels twitch every alert_pause_s).
  alert_rearm_s: 3.0
  show_preview: true
  # TASK-07 (D4 -- FSM: Path Follow + Junctions)
  align_tolerance_deg: 4.0    # was 8.0 -- tighter alignment before cruising
  creep_timeout_s: 3.0        # abort creep -> scan if 60-90cm not reached in time
  center_gain: 0.0035         # corridor centering P-gain (left/right sonar diff -> omega)
  center_omega_max: 0.15      # cap on centering omega
  path_gain: 0.02             # A* waypoint heading-follow P-gain
  path_omega_max: 0.25        # cap on path-follow omega

# TASK-01 through TASK-09 tunables (D1/D2/D5) -- all Python/YAML only,
# no hardware/firmware changes. See TEAM_NAVIGATION_TASKS.pdf.
navigation:
  # TASK-01: sonar median filter
  sonar_filter_window: 5
  sonar_max_jump_cm: 80.0
  # TASK-02: yaw jump guard
  yaw_max_deg_per_s: 90.0
  # TASK-04: occupancy grid cell size (planner map, separate from the
  # human-readable ASCII map in the `map:` section above)
  occupancy_cell_m: 0.05
  # TASK-06/07: how often (seconds) to replan a frontier path with A*
  replan_interval_s: 1.5
  # TASK-08: stuck / oscillation watchdog
  watchdog_pose_timeout_s: 4.0
  watchdog_state_timeout_s: 8.0
  # TASK-09: unique human tracker merge radius (a detection within this
  # many meters of an existing pin is treated as the SAME person)
  human_merge_radius_m: 0.8

map:
  enabled: true
  file: maps/tentative_map.txt
  trajectory_log: maps/robot_movement_log.txt
  cell_size_m: 0.05           # 5cm per character
  width: 80
  height: 40
